@if (rating) {
  <div class="text-primary mr-2">
    @for (ratingItem of ratings; track ratingItem) {
      <small
        class="fa-star"
        [ngClass]="{
          far: isFar(ratingItem),
          fas: isFas(ratingItem),
          'fa-star-half-alt': isFaStarHalf(ratingItem)
        }"
        [title]="rating.rate"
      (click)="onClick(ratingItem)"></small>
    }
  </div>
  @if (!hideRating) {
    <small class="pt-1">({{ rating.count }} Reviews)</small>
  }
}
